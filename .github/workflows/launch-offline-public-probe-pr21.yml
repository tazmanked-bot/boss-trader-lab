name: BOSS Trader owner-run offline public-probe review PR21

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boss-trader-public-probe-pr21-offline
  cancel-in-progress: false

jobs:
  offline-public-probe-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact reviewed research commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b70127b4fe3cafad1db2cbf4942fd517f5cc27be
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Verify immutable commit and offline-only scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "b70127b4fe3cafad1db2cbf4942fd517f5cc27be"
          git rev-parse HEAD
          python --version
          echo "Offline flaw-characterization tests only; green is not live safety clearance."
      - name: Run public-probe flaw characterization
        run: python -B -m unittest discover -s tests -p test_kraken_public_probe_review.py -v
      - name: Run full offline regression
        run: python -B -m unittest discover -s tests -v
      - name: Prove ordinary diagnostic CLI stays disabled
        shell: bash
        run: |
          set +e
          output="$(python -B -m research.kraken_spot_diagnostic --live --authorize)"
          code=$?
          set -e
          test "$code" -eq 2
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["reason"]=="AUTHORIZATION_MISSING" and d["requests"]==0; print("DISABLED_CLI_PASS")' "$output"
