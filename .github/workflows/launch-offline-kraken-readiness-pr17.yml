name: BOSS Trader owner-run offline Kraken readiness PR17

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boss-trader-kraken-readiness-pr17-manual
  cancel-in-progress: false

jobs:
  offline-kraken-readiness-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact reviewed readiness revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 07e722c16d29c6d5e61c4ba02ee1fccb14392f4e
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Verify immutable research revision and environment
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "07e722c16d29c6d5e61c4ba02ee1fccb14392f4e"
          git rev-parse HEAD
          python --version
          echo "Offline characterization only; no Kraken requests or trading"
      - name: Run eight readiness contract tests
        run: python -B -m unittest discover -s tests -p test_kraken_live_readiness_contract.py -v
      - name: Run all offline regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Verify readiness test source syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          name = "tests/test_kraken_live_readiness_contract.py"
          ast.parse(Path(name).read_text(), filename=name)
          print("SYNTAX_PASS:", name)
          PY
