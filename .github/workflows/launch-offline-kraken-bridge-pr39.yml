name: BOSS Trader owner-run offline Kraken reversal bridge PR39

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boss-trader-kraken-bridge-pr39-manual
  cancel-in-progress: false

jobs:
  offline-kraken-bridge-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact reviewed research head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0500fb8a2e9f891d648d5e12a0a1b10a8b7530cc
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Verify immutable source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "0500fb8a2e9f891d648d5e12a0a1b10a8b7530cc"
          git rev-parse HEAD
          python --version
          echo "STATIC SYNTHETIC FIXTURE ONLY; source admission HOLD; no trading"
      - name: Focused offline Kraken reversal groundwork tests
        run: python -B -m unittest discover -s tests -p test_kraken_reversal_groundwork.py -v
      - name: Full offline regression suite
        run: python -B -m unittest discover -s tests -v
      - name: Disabled default and live flags must refuse
        shell: bash
        run: |
          set +e
          python -B -m research.kraken_spot_reversal_bridge_prototype > disabled-default.json
          c1=$?
          python -B -m research.kraken_spot_reversal_bridge_prototype --live --authorize > disabled-flags.json
          c2=$?
          set -e
          test "$c1" -eq 2
          test "$c2" -eq 2
          python - <<'PY'
          import json
          for path in ("disabled-default.json", "disabled-flags.json"):
              with open(path, encoding="utf-8") as inp:
                  data = json.load(inp)
              assert data["overall"] == "HOLD"
              assert data["reason"] == "AUTHORIZATION_MISSING"
              assert data["requests"] == 0
              assert data["proposed_input"] is None
              assert data["candidate_stage"] == "NOT_ADMITTED"
          print("DISABLED_CLI_PASS: 0 requests; source not admitted; operational HOLD")
          PY
