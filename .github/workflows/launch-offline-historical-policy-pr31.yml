name: BOSS Trader owner-run offline historical policy PR31

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boss-trader-historical-policy-pr31-manual
  cancel-in-progress: false

jobs:
  offline-historical-policy-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout immutable proposed policy revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5d42d92c78543fcecfc4beaf8059e0d77b594270
          persist-credentials: false
      - name: Set up pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Verify exact research revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "5d42d92c78543fcecfc4beaf8059e0d77b594270"
          git rev-parse HEAD
          python --version
          echo "Historical policy PROPOSED/HOLD; offline mathematical verification only."
      - name: Run focused historical-policy adversarial tests
        run: python -B -m unittest discover -s tests -p test_historical_data_policy_018.py -v
      - name: Run full offline regression suite
        run: python -B -m unittest discover -s tests -v
      - name: Verify both gated diagnostic CLIs are disabled
        shell: bash
        run: |
          set +e
          first="$(python -B -m research.kraken_spot_diagnostic --live --authorize)"
          c1=$?
          second="$(python -B -m research.kraken_probe_corrections)"
          c2=$?
          set -e
          test "$c1" -eq 2
          test "$c2" -eq 2
          python -c 'import json,sys; a,b=map(json.loads,sys.argv[1:]); assert all(x["reason"]=="AUTHORIZATION_MISSING" and x["requests"]==0 for x in (a,b)); print("BOTH_DISABLED_CLI_PASS")' "$first" "$second"
