name: BOSS Trader owner-run offline B4 B5 feasibility PR25

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boss-trader-b4-b5-pr25-offline
  cancel-in-progress: false

jobs:
  offline-feasibility-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout immutable feasibility commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a3ead9df39ad2defe723c6f3966b9d7bf69ab6ef
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Assert exact source revision and print bounded non-secret facts
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a3ead9df39ad2defe723c6f3966b9d7bf69ab6ef"
          python - <<'PY'
          import json, os, platform, ssl, sys, multiprocessing
          def bounded(value):
              value=str(value)
              if not value or len(value)>128 or any(not 32<=ord(c)<=126 for c in value):
                  return "UNKNOWN"
              return value
          facts = {
              "evidence_class": "RUNNER_FACTS_ONLY_NOT_CLOCK_ATTESTATION",
              "python_version": bounded(sys.version.split()[0]),
              "openssl_version": bounded(ssl.OPENSSL_VERSION),
              "os_id": bounded(platform.system()),
              "os_version": bounded(platform.version()),
              "kernel_release": bounded(platform.release()),
              "machine": bounded(platform.machine()),
              "image_os": bounded(os.environ.get("ImageOS", "UNKNOWN")),
              "image_version": bounded(os.environ.get("ImageVersion", "UNKNOWN")),
              "start_method": bounded(multiprocessing.get_start_method(allow_none=True) or "UNSELECTED"),
              "ca_bundle_sha256": None,
              "decision": "HOLD",
          }
          result=json.dumps(facts, sort_keys=True)
          assert len(result)<4096
          print(result)
          PY
      - name: Verify synthetic clock and runner models
        run: python -B -m unittest discover -s tests -p test_clock_runner_feasibility.py -v
      - name: Verify baseline and new offline regressions
        run: python -B -m unittest discover -s tests -v
      - name: Verify both diagnostic CLIs remain disabled
        shell: bash
        run: |
          set +e
          first="$(python -B -m research.kraken_probe_corrections)"
          one=$?
          second="$(python -B -m research.kraken_spot_diagnostic --live --authorize)"
          two=$?
          set -e
          test "$one" -eq 2
          test "$two" -eq 2
          python -c 'import json,sys; a,b=map(json.loads,sys.argv[1:]); assert all(x["reason"]=="AUTHORIZATION_MISSING" and x["requests"]==0 for x in (a,b)); print("BOTH_DISABLED_CLI_PASS")' "$first" "$second"
