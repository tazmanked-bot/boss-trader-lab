name: BOSS Trader owner-run offline refusal registry PR13

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boss-trader-refusal-pr13-manual
  cancel-in-progress: false

jobs:
  offline-refusal-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout pinned refusal registry research revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 98dc110ea451f38ab12dd41167824855e297bb1d
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Assert exact tested revision and stdlib-only scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "98dc110ea451f38ab12dd41167824855e297bb1d"
          git rev-parse HEAD
          python --version
          echo "Offline synthetic research only; no exchange requests or orders"
      - name: Run refusal-registry adversarial tests
        run: python -B -m unittest discover -s tests -p test_spot_refusal_registry.py -v
      - name: Run complete repository offline regression suite
        run: python -B -m unittest discover -s tests -v
      - name: Verify research Python modules compile
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("research/spot_refusal_registry.py", "tests/test_spot_refusal_registry.py"):
              ast.parse(Path(name).read_text(), filename=name)
              print(f"SYNTAX_PASS: {name}")
          PY
