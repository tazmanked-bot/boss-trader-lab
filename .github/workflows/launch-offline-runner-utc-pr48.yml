name: BOSS Trader owner-run offline runner UTC PR48

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boss-trader-runner-utc-pr48-owner
  cancel-in-progress: false

jobs:
  offline-runner-utc-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR48 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a112f2ad12b5b5d0dece1e0d26fdab80d9086fb3
          persist-credentials: false
      - name: Install pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Verify exact head and clean initial worktree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a112f2ad12b5b5d0dece1e0d26fdab80d9086fb3"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          python --version
          echo "OFFLINE ONLY: fake DNS/TLS/HTTP; no Kraken, no NTP, no orders"
      - name: Focused runner and UTC model tests
        run: python -B -m unittest tests.test_utc_evidence_026 tests.test_runner_diagnostic_026 -v
      - name: Full regression suite
        run: python -B -m unittest discover -s tests -v
      - name: Default harness and authentic UTC remain disabled
        shell: bash
        run: |
          set +e
          python -B -m research.runner_diagnostic_026 > default-026.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          from research import utc_evidence_026 as utc
          x=json.load(open("default-026.json",encoding="utf-8"))
          assert x["reason"]=="AUTHORIZATION_MISSING" and x["requests"]==0
          assert x["B4"]=="NO-GO" and x["B5"]=="HOLD"
          y=utc.authentic_verifier()
          assert y["B4"]=="NO-GO" and y["independent_utc"] is False
          print("DEFAULT_DISABLED; AUTHENTIC_UTC_NOT_ADMITTED; NO REAL REQUESTS")
          PY
      - name: Measure ten offline child-process cases on selected runner
        shell: bash
        env:
          REVIEWED_SHA: a112f2ad12b5b5d0dece1e0d26fdab80d9086fb3
        run: |
          python -B -m research.runner_diagnostic_026 --offline-run --revision "$REVIEWED_SHA" > runner-026.json
          python - <<'PY'
          import json
          x=json.load(open("runner-026.json",encoding="utf-8"))
          p=x["profile"]
          assert x["offline_diagnostic_status"]=="EXPECTED_RESULTS"
          assert x["requests"]==0 and x["real_network_guard"]=="DENY"
          assert x["B1"]==x["B2"]==x["B3"]==x["B5"]=="HOLD" and x["B4"]=="NO-GO"
          assert x["hard_containment_verified"] is False
          assert x["independent_utc_verified"] is False
          assert p["revision_status"]=="MATCH"
          assert p["git_head_observed"]=="a112f2ad12b5b5d0dece1e0d26fdab80d9086fb3"
          assert p["python"]=="3.11.17"
          assert len(x["cases"])==10 and all(c["reaped"] and c["requests"]==0 for c in x["cases"])
          assert all(c["fd_evidence"]=="BASELINE_RESTORED" for c in x["cases"])
          print("OFFLINE_RUNNER_EVIDENCE_SUMMARY")
          print(json.dumps({"revision_status":p["revision_status"],"python":p["python"],
            "kernel":p["kernel"],"os":p["os"],"runner_image":p["runner_image"],
            "cgroup_before":x["cgroup_before"],"cgroup_after":x["cgroup_after"],
            "cases":[{"case":c["case"],"reason":c["reason"],"elapsed_ns":c["elapsed_ns"],
              "observed_overshoot_ns":c["observed_overshoot_ns"],"kill_to_reap_ns":c["kill_to_reap_ns"],
              "reaped":c["reaped"],"parent_fd_peak":c["parent_fd_peak"],
              "child_fd_peak":c["child_fd_peak"],"aggregate_sampled_peak_rss_bytes":c["aggregate_sampled_peak_rss_bytes"]}
              for c in x["cases"]]},sort_keys=True))
          print("ALL LIVE GATES HOLD / B4 NO-GO; NO ORDERS")
          PY
