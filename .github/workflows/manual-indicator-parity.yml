name: BOSS Trader isolated indicator parity research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm read-only baseline tests
        run: python -m unittest discover -s tests -v
      - name: Install pinned evaluation-only indicator release
        run: python -m pip install 'pandas-ta-classic==0.9.0'
      - name: Compare offline synthetic indicators only
        run: python -m research.indicator_parity
