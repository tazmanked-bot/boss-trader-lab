name: BOSS Trader owner-run offline live-readiness PR29

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boss-trader-live-readiness-pr29-offline
  cancel-in-progress: false

jobs:
  offline-live-readiness-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact reviewed readiness revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 19d27504853587cf4ebea43f34d762ded5ccffd8
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Verify immutable source and offline restrictions
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "19d27504853587cf4ebea43f34d762ded5ccffd8"
          git rev-parse HEAD
          python --version
          echo "Synthetic-only validation. Live Kraken NO-GO, historical alternative HOLD."
      - name: Run focused Stage A offline readiness tests
        run: python -B -m unittest discover -s tests -p test_live_observation_readiness_017.py -v
      - name: Run complete offline regression suite
        run: python -B -m unittest discover -s tests -v
      - name: Confirm two diagnostic CLIs remain disabled
        shell: bash
        run: |
          set +e
          a="$(python -B -m research.kraken_spot_diagnostic --live --authorize)"
          ac=$?
          b="$(python -B -m research.kraken_probe_corrections)"
          bc=$?
          set -e
          test "$ac" -eq 2
          test "$bc" -eq 2
          python -c 'import json,sys; a,b=map(json.loads,sys.argv[1:]); assert all(x["reason"]=="AUTHORIZATION_MISSING" and x["requests"]==0 for x in (a,b)); print("DISABLED_CLI_PASS")' "$a" "$b"
