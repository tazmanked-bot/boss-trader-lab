name: BOSS Trader owner-run offline Kraken diagnostic PR19

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boss-trader-kraken-diagnostic-pr19-manual
  cancel-in-progress: false

jobs:
  offline-kraken-diagnostic-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact reviewed diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4e4f184f4847e84bafcd3e1ea7d7eaad6f466419
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Verify source identity and Python
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "4e4f184f4847e84bafcd3e1ea7d7eaad6f466419"
          git rev-parse HEAD
          python --version
          echo "Owner-run offline fake-only tests. No exchange requests, keys or trading."
      - name: Run diagnostic offline tests
        run: python -B -m unittest discover -s tests -p test_kraken_spot_diagnostic.py -v
      - name: Run full offline regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Check disabled CLI refuses all activation
        shell: bash
        run: |
          set +e
          output="$(python -B -m research.kraken_spot_diagnostic --live --authorize)"
          code=$?
          set -e
          test "$code" -eq 2
          python -c 'import json,sys; o=json.loads(sys.argv[1]); assert o["reason"]=="AUTHORIZATION_MISSING" and o["requests"]==0; print("DISABLED_CLI_PASS")' "$output"
