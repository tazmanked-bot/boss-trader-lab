name: BOSS Trader owner-run indicator parity (PR 4)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boss-trader-indicator-parity-manual
  cancel-in-progress: false

jobs:
  isolated-synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch only (no write credentials)
        uses: actions/checkout@v4
        with:
          ref: research/issue-1-indicator-parity
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Show checked out commit for audit
        run: git rev-parse HEAD
      - name: Run existing offline safety checks
        run: python -m unittest discover -s tests -v
      - name: Install pinned direct dependency in temporary runner
        run: python -m pip install --disable-pip-version-check 'pandas-ta-classic==0.9.0'
      - name: Record package versions
        run: python -m pip freeze
      - name: Run synthetic indicator comparison only
        run: python -m research.indicator_parity
